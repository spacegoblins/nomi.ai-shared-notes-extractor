<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="inject.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1f222a;
      color: #e4e4e7;
      width: 320px;
      padding: 20px 24px;
      min-height: 80px;
    }

    /* Override Urbanist from inject.css — not loaded in popup context */
    .nomi-ext-modal-tab,
    .nomi-ext-modal-tab--active {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
  </style>
</head>
<body>
  <div class="nomi-ext-modal-title">Nomi.AI Shared Notes Extractor</div>
  <div class="nomi-ext-modal-tabs" id="tab-bar"></div>
  <div id="tab-content"></div>

  <script src="popup.js"></script>
</body>
</html>
